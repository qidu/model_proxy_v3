# Plain-nginx auth gate for model_proxy_v3 (no Lua / no OpenResty required).
#
# Drop this entire file's contents into your `http { }` block, or `include`
# it from there. Each model-API location checks ONE specific header against
# a SET of configured keys (any match passes). Exempt paths (/health, /,
# /dashboard, /v1/models) bypass auth.
#
# To add/remove a key: edit the valid-key map blocks below and
# `nginx -s reload`. Maps rebuild on reload, no restart needed.

# ===========================================================================
# Everything below lives inside http { }.
# ===========================================================================

# ---------------------------------------------------------------------------
# Valid-key sets (edit these). Each maps the presented credential to a fixed
# sentinel "ok"; unknown keys fall through to default "". The location's `if`
# then compares $key_*_valid != "ok". Add/remove keys one per line and reload.
# ---------------------------------------------------------------------------
map $cred_anth $key_anth_valid {
    default            "";                # /v1/messages: x-api-key (Bearer fallback)
    "sk-proxy-ANTH-1"  "ok";
    "sk-proxy-ANTH-2"  "ok";
}
map $auth_bearer $key_openai_valid {
    default            "";                # /v1/responses, /v1/chat/completions, /v1/embeddings
    "sk-proxy-OPEN-1"  "ok";
    "sk-proxy-OPEN-2"  "ok";
}
map $http_x_goog_api_key $key_gemini_valid {
    default            "";                # /v1beta/models/* (x-goog-api-key)
    "sk-proxy-GEM-1"   "ok";
    "sk-proxy-GEM-2"   "ok";
}
map "" $proxy_upstream {
    default "http://127.0.0.1:8788";      # the Worker / node server
}

# ---------------------------------------------------------------------------
# Normalize inbound headers into comparable credential strings.
#   $auth_bearer        = bearer token from Authorization (or "")
#   $cred_anth          = x-api-key if present, else bearer token, else ""
#   (gemini/openai locations read their raw header / $auth_bearer directly)
# ---------------------------------------------------------------------------
map $http_authorization $auth_bearer {
    default                                     "";
    "~^\\s*[Bb]earer\\s+(?<tok>\\S+?)\\s*$"     "$tok";
}
map $http_x_api_key $cred_anth {
    ""      $auth_bearer;
    default $http_x_api_key;
}

# 401 bodies (reused across locations).
map "" $body_missing_openai {
    default '{"type":"error","error":{"type":"authentication_error","message":"missing Authorization: Bearer"}}';
}
map "" $body_invalid_openai {
    default '{"type":"error","error":{"type":"authentication_error","message":"invalid API key"}}';
}
map "" $body_missing_anth {
    default '{"type":"error","error":{"type":"authentication_error","message":"missing x-api-key (or Authorization: Bearer)"}}';
}
map "" $body_invalid_anth {
    default '{"type":"error","error":{"type":"authentication_error","message":"invalid API key"}}';
}
map "" $body_missing_gemini {
    default '{"type":"error","error":{"type":"authentication_error","message":"missing x-goog-api-key"}}';
}
map "" $body_invalid_gemini {
    default '{"type":"error","error":{"type":"authentication_error","message":"invalid API key"}}';
}

server {
    listen 8080;
    server_name proxy.example.com;

    # ssl_certificate     /etc/ssl/proxy.crt;
    # ssl_certificate_key /etc/ssl/proxy.key;

    default_type application/json;

    # ----- Exempt paths (no auth) ----------------------------------------
    location = /health  { proxy_pass $proxy_upstream; }
    location = /        { proxy_pass $proxy_upstream; }
    location /dashboard { proxy_pass $proxy_upstream; }

    # /v1/models: public model listing (SDK discovery). Bare path and query
    # form /v1/models?... both match this exact location. Sub-paths fail closed.
    location = /v1/models { proxy_pass $proxy_upstream; }
    location /v1/models/  { return 404; }

    # ----- OpenAI: Authorization: Bearer --------------------------------
    location /v1/responses {
        if ($auth_bearer = "")            { return 401 $body_missing_openai; }
        if ($key_openai_valid != "ok")    { return 401 $body_invalid_openai; }
        proxy_pass $proxy_upstream;
    }
    location /v1/chat/completions {
        if ($auth_bearer = "")            { return 401 $body_missing_openai; }
        if ($key_openai_valid != "ok")    { return 401 $body_invalid_openai; }
        proxy_pass $proxy_upstream;
    }
    location /v1/embeddings {
        if ($auth_bearer = "")            { return 401 $body_missing_openai; }
        if ($key_openai_valid != "ok")    { return 401 $body_invalid_openai; }
        proxy_pass $proxy_upstream;
    }

    # ----- Anthropic Messages: x-api-key (Bearer fallback) --------------
    location /v1/messages {
        if ($cred_anth = "")            { return 401 $body_missing_anth; }
        if ($key_anth_valid != "ok")    { return 401 $body_invalid_anth; }
        proxy_pass $proxy_upstream;
    }

    # ----- Gemini native: x-goog-api-key --------------------------------
    location /v1beta/models {
        if ($http_x_goog_api_key = "")  { return 401 $body_missing_gemini; }
        if ($key_gemini_valid != "ok")  { return 401 $body_invalid_gemini; }
        proxy_pass $proxy_upstream;
    }

    # ----- Default: proxy everything else -------------------------------
    # Unrecognized paths get no auth gate here; the Worker returns 404/405
    # itself. To fail closed, replace proxy_pass with `return 404`.
    location / {
        proxy_pass $proxy_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
