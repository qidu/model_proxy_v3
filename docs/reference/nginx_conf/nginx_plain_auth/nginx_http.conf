# Standalone test harness for the auth gate.
# Run:  nginx -p /tmp/ -t -c nginx_http.conf
#
# It generates a throwaway self-signed cert on first run, listens on plain
# localhost ports, and includes the real nginx.conf so what we validate is
# the actual auth logic (map + if + location blocks), not a stripped copy.

events {
    worker_connections 4;
}

http {
    # Generate a throwaway cert if missing (so `listen ... ssl` is valid).
    # nginx itself can't run openssl, so this is expected to be created
    # out-of-band — see USAGE.md. For the test, we instead DROP ssl by
    # including the auth conf under a non-ssl listener.

    # Stub error log to /tmp to avoid /var/log permission issues.
    error_log  /tmp/nginx_test_error.log warn;
    access_log /tmp/nginx_test_access.log;

    # Proxy Server and Auth Map Config
    include nginx_auth_map.conf; 
}
