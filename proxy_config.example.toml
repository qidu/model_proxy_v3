# WARNING: Duplicate section headers (e.g. two [models.gemini] blocks) or duplicate
# keys within a section cause silent data loss — the second occurrence overwrites the
# first. The proxy will now log a warning to stderr when this happens, but the safest
# fix is to avoid duplicates entirely: merge all entries for a section into one block.

[dashboard]
# Optional: require Authorization: Bearer <api_key> for /dashboard/api/*.
# If omitted or empty, dashboard APIs remain loopback-only.
api_key = "test"

[remote]
# --- auth role: pre-route gate (fail-CLOSED) ---
# Optional: remote auth sidecar. Proxy forwards client auth headers (Authorization,
# x-api-key, x-goog-api-key) plus User-Agent to this URL (GET, follows 301/302).
# HTTP 200 = success; any 4xx/5xx = 401 to the client; network error = 503.
# If unset, the proxy only checks that at least one auth header is present.
# auth_server = "https://auth.example.com/validate"
# auth_with_model: defer auth until after the request body is parsed; forward
# the requested model id as x-resource-for header. Default: false.
# auth_with_model = false
# auth_with_body: defer auth until after the request body is parsed; POST the
# entire parsed request body (raw JSON) to the auth server. Method switches
# GET → POST. Either auth_with_model or auth_with_body triggers the deferred
# path. On routes with no body, auth_with_body sends no body. Default: false.
# auth_with_body = false
# auth_passthrough_with: controls which key is forwarded to the upstream provider
# (not the auth sidecar). "user_key" (default): forward client's key; "config_key": use configured api_key.
# auth_passthrough_with = "user_key"

# --- recording role: post-response (fire-and-forget) ---
# Optional: POST per-request model usage records to an HTTP collector.
# Payload includes request_id, endpoint, raw user_key, model, response_status,
# and token usage counters: input/cached/cache_written/output/total.
# Non-2xx upstream responses are recorded with zero token counters.
# record_server = "http://127.0.0.1:8080/model-usage"
# record_response_body: when true, each usage record also includes the
# constructed response_body (parsed JSON for non-streaming; accumulated raw SSE
# text for streaming). Sent raw (not base64). Default: false (field omitted).
# record_response_body = false

[general]
# auth_passthrough_with is now under [remote] (see above).
budget_to_effort_low = 32768
budget_to_effort_medium = 65536
budget_to_effort_high = 128000
# Sliding duration (1h, 1d): rolling window from "now".
# Calendar duration (1w, 1m): anchored to week_start_day / first-of-month.
global_token_limit = "700M 1w"
# Anchor day for the `1w` calendar window. Default is "monday".
week_start_day = "monday"
# Store config api_keys in the OS keychain (local/dev-host use only — not for
# Docker or Cloudflare Workers). Applies only to configured api_keys of
# [models.*] targets (and [default_upstream].default_api_key) in this local
# file — ignored for Consul/Apollo config sources, N/A for composite aliases,
# and caller/user keys from request headers are never stored. On the first
# load every plaintext api_key is saved under the `model_proxy_v3` service
# with account "<target_model_id>/<base_url>" and this file is rewritten
# (backup: .bak) with those keys replaced by the literal STORE_KEY_IN_SYSTEM
# sentinel; every later load resolves the sentinels back from the keychain.
# Startup fails loud when the keychain is unavailable. Requires the
# @github/keytar native addon (optionalDependency, fetched from GitHub; npm
# installs a prebuilt NAPI binary — see README "System & toolchain requirements")
# — if startup then fails with "Cannot find package '@github/keytar'", see README
# ("OS keychain key storage") for recovery (prune-style npm runs can strip the
# declaration from package.json; restore it before reinstalling).
# store_key_in_system = true

[default_upstream]
# `default_base_url` is the *global* upstream endpoint applied **only** to models
# that are NOT claimed by any `[models.*]` category section — i.e. a model name
# that falls through every section's exact / wildcard / catch-all lookup gets
# routed here. It is **NOT** a fallback chain link for any category. Every
# `[models.*]` section must define its own `base_url` (section-level), or every
# entry in that section must define its own per-entry `base_url`. A section that
# does neither will fail to resolve at routing time rather than silently
# inheriting from this global default.
default_base_url = "https://api.qnaigc.com"
# default_api_key = "sk-..."  # In user_key mode (default): fallback for [models.FREE] and models
                               # with no configured key. In config_key mode: used for all models.
                               # Typically left unset in production.

[models.claude]
# For the `claude` model category:
# Models in this section are routed to an Anthropic Messages-compatible upstream.
# `upstream_mode` declares the native protocol used for every entry below.
# `base_url` is the default endpoint; an empty `api_key` means the section inherits
# the global key. Each model entry is an inline table:
#   {target = "upstream_model_name", base_url = "override_or_empty", api_key = "override_or_empty", mode = "override_or_empty"}
# where empty strings fall back to the section-level defaults.
# The optional `mode` field overrides `upstream_mode` for just that entry
# (e.g. one entry in an `anthropic-messages` section can route to an OpenAI upstream).
# - Exact-match entries (e.g. `claude-opus-4-8`) take priority and are used when
#   the incoming model name matches the key exactly.
# - The `claude-*` wildcard is the fallback for any other `claude-*` name that
#   no specific entry covers. Upstream model name is rewritten via the pattern.
upstream_mode = "anthropic-messages"
base_url = "https://api.qnaigc.com"
# Exact match: requests for `claude-fable-5` are rewritten to upstream `claude-fable-5`
# and sent to the section's `base_url` using the inherited api_key.
claude-fable-5 = {}
claude-opus-4-8 = {}
claude-opus-4-6 = {}
claude-sonnet-4-6 = {}
# Wildcard fallback: catches any `claude-*` model not matched above. The `*` in the
# upstream name is replaced with whatever suffix the incoming model carries.
"claude-*" = {}


[models.gpt]
# For the `gpt` model category:
# Models in this section are routed to an OpenAI Responses-compatible upstream (/v1/responses).
# `upstream_mode` selects the native protocol for all entries below.
# `base_url` and `api_key` are the section-level defaults; each model entry is:
#   {target = "upstream_model_name", base_url = "override_or_empty", api_key = "override_or_empty", mode = "override_or_empty"}
# with empty override strings falling back to the section defaults.
# The optional `mode` field overrides `upstream_mode` for just that entry.
# - Exact-match entries (e.g. `gpt-4o`) are used when the incoming model name
#   matches the key exactly.
# - The `gpt-*` wildcard is the fallback for any other `gpt-*` name and
#   rewrites the upstream model name via the `*` substitution.
upstream_mode = "openai-responses"
base_url = "https://api.openai.com"
api_key = "sk-***"
# Exact match: requests for `gpt-4o` are forwarded verbatim to the upstream.
gpt-4o = {}
# Wildcard fallback: catches any `gpt-*` model not matched above.
"gpt-*" = {}

[models.gemini]
# For `gemini` model category:
# Models in this section are routed to a Gemini `generateContent`-compatible upstream.
# `upstream_mode` selects the native protocol for all entries below.
# `base_url` and `api_key` are the section-level defaults; each model entry is:
#   {target = "upstream_model_name", base_url = "override_or_empty", api_key = "override_or_empty", mode = "override_or_empty"}
# with empty override strings falling back to the section defaults.
# The optional `mode` field overrides `upstream_mode` for just that entry.
# - Exact-match entries (e.g. `gemini-3.0-flash-preview`) are used when the
#   incoming model name matches the key exactly.
# - The `gemini-*` wildcard is the fallback for any other `gemini-*` name and
#   rewrites the upstream model name via the `*` substitution.
upstream_mode = "gemini-generatecontent"
base_url = "https://api.example.com"
api_key = "sk-***"
# Exact match: requests for `gemini-3.0-flash-preview` are rewritten to upstream
# `gemini-3-flash-preview` and sent to the section's `base_url` with `api_key`.
gemini-3.0-flash-preview = {target = "gemini-3-flash-preview"}
# Wildcard fallback: catches any `gemini-*` model not matched above.
"gemini-*" = {}

[models.FREE]
# For the `FREE` model category:
# This section exposes a curated set of models that the proxy can serve to
# callers without requiring them to supply their own upstream credentials.
# Each specific model entry is routed using the section's configured
# `upstream_mode`, `base_url`, and `api_key` (with each entry's empty override
# strings falling back to those section defaults). The optional per-entry `mode`
# field overrides `upstream_mode` for just that entry.
#
# The section-level `api_key` takes priority over any auth key sent by the
# caller on the inbound request. Per-entry `api_key` overrides take priority
# over both the section-level key and the caller's key. This is what enables
# the **FREE** tier: the proxy authenticates to the upstream on the caller's
# behalf, so users can hit these models without bringing their own upstream
# API key.
upstream_mode = "anthropic-messages"
base_url = "http://localhost:3000"
api_key = "invalid-sk-f92454"
# Exact match. Inherits `upstream_mode` and `base_url` from the section, and
# uses the section's configured `api_key` to authenticate to the upstream,
# overriding any auth key the caller sent on the request.
opus48 = {target = "claude-opus-4-8"}
opus46 = {target = "claude-opus-4-6"}
sonnet46 = {target = "claude-sonnet-4-6"}
# Per-entry `base_url` override routes to a different upstream endpoint while
# still authenticating with the section's configured `api_key` (which still
# takes priority over the caller's auth key).
deepseek-v4-flash = {target = "deepseek-v4-flash", base_url = "https://anthropic.qnaigc.com", api_key = "sk-cp-p_i6lDK"}
deepseek-v4-pro = {target = "deepseek-v4-pro", base_url = "https://api.qnaigc.com", api_key = "sk-cp-p_i6lDK", mode = "openai-completions"}
# Per-entry `api_key` override. The entry's own key wins over both the section
# default and any auth key supplied by the caller, so this upstream is hit
# with its dedicated credentials.
# `mode` overrides the section's `upstream_mode` for just this entry.
minimax-m3 = {target = "MiniMax-M3", base_url = "https://api.minimaxi.com", api_key = "sk-cp-p_i6lDK", mode = "openai-completions"}
minimax-m2.7 = {target = "MiniMax-M2.7-HighSpeed", base_url = "https://api.minimaxi.com/anthropic", api_key = "sk-cp-p_i6lDK"}
# Per-entry `max_tokens` (bare integer, not a quoted string): fills the value
# when the request omits `max_tokens` (required by the Anthropic API and some
# compatible upstreams — e.g. DeepSeek's Anthropic-compatible endpoint rejects
# requests without it) and caps larger client values. When unset, the proxy
# never sets, modifies, or caps the field: a request that omits `max_tokens`
# is forwarded as-is. Configure it on every target whose upstream requires it.
# deepseek-v4-anth = {target = "deepseek-v4-flash", base_url = "https://api.deepseek.com/anthropic", api_key = "sk-...", max_tokens = 8192}
# Reverse override: the section default is `anthropic-messages`, but these entries
# target an OpenAI-completions upstream — per-entry `mode` switches protocol for
# just these models while all other entries stay on the section default.
# (If the section default were `openai-completions`, `mode = "anthropic-messages"`
# lets individual Claude-API entries coexist in the same section.)
# opus48 = {target = "claude-opus-4-8", base_url = "http://localhost:3000", api_key = "", mode = "anthropic-messages"}
# sonnet46 = {target = "claude-sonnet-4-6", base_url = "http://localhost:3000", api_key = "", mode = "anthropic-messages"}


[models.default]
# For the `default` model category (and the section's catch-all wildcard):
# This is the default routing tier for any model that didn't match a more
# specific section (e.g. `models.claude`, `models.FREE`, `models.gemini`).
# Each specific model entry uses the inline-table form:
#   {target = "upstream_model_name", base_url = "override_or_empty", api_key = "override_or_empty", mode = "override_or_empty"}
# with empty override strings falling back to the section defaults.
# The optional `mode` field overrides `upstream_mode` for just that entry.
#
# Unlike the `FREE` section, the auth key sent by the caller on the inbound
# request takes priority over ALL configured `api_key` values on this tier,
# including per-entry overrides. The `api_key` field is therefore
# intentionally left unset by admins in practice — it only acts as a
# fallback when the caller did not supply an auth key. Callers are expected
# to bring their own upstream credentials and use the proxy to rewrite /
# route the request to the right backend.
upstream_mode = "openai-completions"
base_url = "https://api.qnaigc.com"
# Placeholder value; in production this is typically left unset so the
# caller's auth key is used. Kept here only as an example of the field shape.
api_key = "sk-56db1e204bf459" # NEVER defined in production.
# Exact matches. Each entry overrides `base_url` (and optionally `api_key`)
# for its specific upstream. The caller's auth key from header wins over ALL
# configured `api_key` values on this tier, including per-entry overrides —
# unlike the `FREE` section where per-entry keys take priority over the caller.
max-m3 = {target = "MiniMax-M3", base_url = "https://api.minimaxi.com", api_key = "sk-cp-p_i6lDK-pZdeY2CvwuT"}
"max-m2.7-high" = {target = "MiniMax-M2.7-highspeed", base_url = "https://api.minimaxi.com", api_key = "sk-cp-p_i6lDK-pZdeY2CvwuT"}
deepseek-v4-flash = {base_url = "https://api.deepseek.com", api_key = "sk-66c13986be87488"}
deepseek-v4-pro = {base_url = "https://api.deepseek.com", api_key = "sk-66c13986be87488"}
# General wildcard fallback. Catches any model name that no specific section
# (claude / FREE / gemini / etc.) and no entry above claimed. The `*` in the
# upstream name is replaced with whatever model name the caller sent, so the
# request is forwarded verbatim to the upstream named in the request, using
# the section's `upstream_mode` and `base_url` and the caller's auth key.
"*" = {}

[models.EMBEDDING]
# For `EMBEDDING` models ONLY.
# If a configured `api_key` exists (section-level or per-entry), it takes
# priority over the caller's auth key because there are not so many embedding existing.
# So this priority order should be easier for users.
# If no `api_key` is configured, the caller's auth key is passed through to the upstream unchanged.
upstream_mode = "openai-completions"
base_url = "https://openrouter.ai/api"

[composite]
# For `composite`, `fusion`, and `alias` model definitions.
#
# This section ONLY defines how an alias / composite / fusion model is built
# from one or more real target models. It does NOT define how those target
# models themselves are routed to an upstream — every target is resolved
# through the regular routing rules in the other `[models.*]` sections
# (`models.claude`, `models.FREE`, `models.gemini`, `models.default`, etc.),
# which still control its `upstream_mode`, `base_url`, `api_key`, and
# auth-key priority.
#
# Three composition strategies are supported:
#   - `composite` model: traffic is distributed across target models by the
#     `share` ratio. Each target may also carry `primary: true` (only one
#     allowed per alias, the default target) and a `fallback` flag, with
#     multiple fallbacks consulted in the configured order if the primary
#     fails.
#   - `fusion` model: targets are orchestrated together to produce a single
#     response. `fusion_options` configures the run (`min_panel` candidates
#     required, `panel_timeout_ms` per-panel timeout, `judge_required`,
#     `expose_metadata` to surface panel outputs to the caller, `max_concurrent`
#     parallel panels). Each target carries a `role`: `panel` runs as a
#     candidate, `synth` merges panel outputs into the final response, and
#     `judge` scores/selects among them. Targets participating in the
#     fusion run are marked with `fusion: 1`.
#   - `coordinator` model: routes the conversation to a `planner` model
#     during the planning stage and switches to an `executor` model once a
#     trigger tool call appears in the message history (mirrors the prewalk
#     pattern from oh-my-pi). Each participant carries `coord = 1` and a
#     `role` of `"planner"` or `"executor"`. The optional top-level `toolset`
#     key lists the tool names that trigger the switch; when absent the proxy
#     uses a curated default set (ExitPlanMode, Edit, Write, Bash,
#     NotebookEdit); when set to `[]` any tool call triggers the switch.
"gpt-all" = {"nvidia/nemotron-3-super-120b-a12b-free" = {share = 40}}
# Single-target alias. `llama` is a rename for `llama3`; the request is
# forwarded via the routing rules for `llama3` in the other `[models.*]`
# sections.
"llama" = {llama3 = {share = 20}}
# Alias with a per-alias `token_limit` (consumed across all targets under
# this alias within the given `duration`). The actual upstream call is
# routed via the rules for `deepseek-v4-flash`. Duration follows the same
# vocabulary as global_token_limit: sliding (1h, 1d) or calendar (1w, 1m).
"claude-haiku-4-5-20251001" = {token_limit = {num = 1000000, duration = "1h"}, "deepseek-v4-flash" = {}}
# Multi-target composite with a per-alias `token_limit`, weighted `share`
# distribution, and a single `primary` target (`max-m3`). Remaining targets
# with `fallback = 0` are not used as fallbacks; targets with `share = 0` are
# disabled. Each target's request is then routed through its own
# `[models.*]` section.
"code-small" = {token_limit = {num = 2000000000, duration = "1d"}, "max-m2.7-high" = {share = 100, fallback = 0}, "max-m3" = {share = 100, primary = true, fallback = 0}, opus48 = {share = 0, fallback = 0}, opus46 = {share = 0, fallback = 0}, sonnet46 = {share = 0}}
# Simple weighted multi-target alias: requests are split between
# `max-m2.7-high` and `max-m3` by their `share` weights. Each leg is then
# routed via its own `[models.*]` section.
"maxplan" = {"max-m2.7-high" = {share = 100}, "max-m3" = {share = 100}}
# Fusion composite. `fusion_options` configures the orchestration run, and
# each target carries a `role` (`panel` / `synth` / `judge`) and is marked
# `fusion = 1` to indicate participation. The actual upstream call for each
# role is routed via the target's own `[models.*]` section.
"smarter" = {fusion_options = {min_panel = 2, panel_timeout_ms = 300000, judge_required = true, expose_metadata = true, max_concurrent = 2}, "deepseek-v4-flash" = {fusion = 1, role = "panel"}, "max-m2.7-high" = {fusion = 1, role = "panel"}, "max-m3" = {role = "synth"}, "deepseek-v4-pro" = {fusion = 1, role = "judge"}}
# Coordinator composite. The planner (strong/expensive) model handles requests
# until a trigger tool appears in history, then the executor (fast/cheap) model
# takes over — reusing the full accumulated context (prewalk pattern).
# `toolset` overrides the default trigger set; omit it to use the default
# (ExitPlanMode, Edit, Write, Bash, NotebookEdit). Use `toolset = []` to hand
# off at the first tool call of any kind.
"smart-coder" = {"deepseek-v4-pro" = {coord = 1, role = "planner"}, "deepseek-v4-flash" = {coord = 1, role = "executor"}, toolset = ["ExitPlanMode", "Edit", "Write"]}
# Coordinator where each role is itself a composite alias (resolved recursively).
# `code-strong` and `code-small` are share/fallback composites defined above.
"smart-claw" = {"code-strong" = {coord = 1, role = "planner"}, "code-small" = {coord = 1, role = "executor"}, toolset = ["ExitPlanMode", "Edit", "Write"]}
# Schedule is higher level definition than composite (fusion) and custom models.
# It defines how to plan or arrange several aliases or models in a timetable.
# for example, a `saver` plan could be: 
# - "maxplan" serves every day from 9 - 12 and 14 - 18.
# - "code-small" serves just weekdays from 0 to 9.
# - "max-m3" serves just weekends.
# - "max-m2.7-high serves all else time cause it has no specific arrange. So it's a fallback model alias in this schedule.
[schedule]
"saver" = {"maxplan" = [{from = 9, to = 12}, {from = 14, to = 18}], "code-small" = [{from = 0, to = 9, days="weekday"}], "max-m3" = [{days = "weekend"}], "max-m2.7-high" = []}

# Transforms — rewrite request/response bodies and headers at named pipeline hooks.
# For complete, runnable transform-set examples, see
# proxy_config.transforms.example.toml.
#
# Transforms are declared as named sets under [transforms.<name>]. Each set
# targets one upstream schema (openai-completions | anthropic-messages |
# openai-responses | gemini-generatecontent) and wires ops/builtins to one or
# more hook points in the pipeline:
#
#   request_ingress   — immediately after the client request body is parsed
#   before_conversion — before protocol conversion (e.g. OpenAI → Anthropic)
#   before_upstream   — just before the HTTP call to the upstream (supports headers)
#   after_upstream    — immediately after the upstream response arrives (non-streaming)
#   response_egress   — just before the response is written to the client (supports headers)
#
# Tier-1 ops (generic field rewrites):
#   rename     — rename a top-level field or per-message field
#   set        — set a field to a fixed value (overwrites existing)
#   default    — set a field only when it is absent or undefined
#   remove     — delete a field
#   map_value  — rewrite a field's value when it equals `from` (optional when_sibling guard)
#
# Tier-2 builtins (deep recursive / cross-message logic):
#   lowercase_tool_schema_types   — lowercase every `type` in tool input schemas
#   recover_tool_message_name     — backfill missing `name` on tool-result messages
#   inject_missing_tool_results   — synthesize placeholder tool_result blocks for
#                                   unmatched tool_use ids (required by some upstreams)
#
# Op paths:
#   top-level field       → bare field name, e.g. `max_tokens`
#   all messages          → `messages[].field`
#   role-filtered         → `messages[role=assistant].field`
#   response-side field   → `$response.field`  (applied to the response body)
#
# Ops are applied in declaration order. Builtins run before ops within the same hook.
#
# Attaching transforms to model entries:
#   In a [models.*] section, add `transforms = "set_name"` (or a comma-separated
#   list `"set_a,set_b"`) inside any model's inline table.
#
# [transform_defaults] wires sets to every model of a given upstream mode
#   without touching individual model entries. Keys are upstream-mode names;
#   values are arrays of transform-set names applied before any per-model sets.
#
# Resolution order (left-to-right, each set sees the previous set's output):
#   mode-defaults (transform_defaults) → category-level transforms → per-entry transforms

# Example: rename `max_tokens` → `max_completion_tokens` for an OpenAI-responses upstream,
# and inject a fixed `reasoning` effort field.
# [transforms.openai_responses_compat]
# schema = "openai-completions"
# before_upstream.ops = [
#   {op = "rename", path = "max_tokens", to = "max_completion_tokens"},
#   {op = "default", path = "reasoning_effort", value = "medium"},
# ]

# Example: fix tool schema types and recover missing tool-result names for
# models that require strict schema conformance.
# [transforms.strict_tools]
# schema = "openai-completions"
# before_upstream.builtins = ["lowercase_tool_schema_types", "recover_tool_message_name"]

# Example: inject a custom upstream header (e.g. an extra auth token) and
# strip a header the upstream rejects.
# [transforms.add_upstream_header]
# schema = "openai-completions"
# before_upstream.ops = [{op = "set", path = "model", value = "gpt-4o"}]
# before_upstream.headers.set = {"X-Custom-Auth" = "token-abc"}
# before_upstream.headers.remove = ["x-stainless-os"]

# Example: rewrite a response-side field before it reaches the client.
# [transforms.mask_model_id]
# schema = "openai-completions"
# response_egress.ops = [{op = "set", path = "$response.model", value = "proxy-model"}]

# Example: echo the client's requested alias back in the response `model` field
# instead of the real upstream model id. By default the response `model` field
# is passthrough (whatever the real upstream model returns) — a client that
# requested "my-fast-model" sees "claude-haiku-4-5-20251001" in the response
# unless this builtin is attached. Works for both the JSON body and each SSE
# chat.completion.chunk event. See docs/transforms-reference.md for details.
# [transforms.restore_alias]
# schema = "openai-completions"
# response_egress.builtins = ["restore_client_model_alias"]
#
# "my-fast-model" = {target = "claude-haiku-4-5-20251001", transforms = "restore_alias"}

# Example: attach transforms to a specific model entry.
# In [models.gpt], add transforms = "strict_tools" to an entry:
#   "gpt-4o" = {transforms = "strict_tools"}
#   "o3" = {target = "o3", transforms = "openai_responses_compat,strict_tools"}

# Example: apply a transform to every openai-completions model automatically.
# [transform_defaults]
# openai-completions = ["strict_tools"]
# anthropic-messages = ["inject_missing_tool_results_set"]

# Builtin-only transform for Anthropic upstreams that reject incomplete tool conversations.
# [transforms.inject_missing_tool_results_set]
# schema = "anthropic-messages"
# before_upstream.builtins = ["inject_missing_tool_results"]

# ---------------------------------------------------------------------------
# Real-world transform sets (used in proxy_config.toml for DeepSeek / MiniMax)
# ---------------------------------------------------------------------------

# DeepSeek openai-completions compat:
#   - lowercase tool schema types (client sends uppercase "STRING" etc.)
#   - recover missing `name` on tool-result messages from prior assistant turn
#   - rewrite assistant content "" → null when tool_calls present
# [transforms.deepseek_compat]
# schema = "openai-completions"
# request_ingress.builtins = ["lowercase_tool_schema_types"]
# before_upstream.builtins = ["recover_tool_message_name"]
# before_upstream.ops = [
#   {op = "map_value", path = "messages[role=assistant].content", when_sibling = "tool_calls", from = "", to = null},
# ]

# DeepSeek anthropic-messages compat:
#   - synthesize placeholder tool_result blocks for unmatched tool_use ids
#     (DeepSeek enforces that every tool_use.id has a matching tool_result)
#   - strip thinking-enabled when the conversation has no prior assistant
#     thinking blocks (DeepSeek rejects it on fresh conversations with
#     400 "The content[].thinking in the thinking mode must be passed back to the API")
# [transforms.deepseek_v4_anthropic_compat]
# schema = "anthropic-messages"
# before_upstream.builtins = ["inject_missing_tool_results", "strip_fresh_thinking"]

# MiniMax openai-completions compat:
#   - rewrite assistant content "" → null when tool_calls present
# [transforms.minimax_compat]
# schema = "openai-completions"
# before_upstream.ops = [
#   {op = "map_value", path = "messages[role=assistant].content", when_sibling = "tool_calls", from = "", to = null},
# ]

# Claude Code anthropic-messages compat:
#   - while `messages` ends on a non-`user` role, pop that message outright
#     (no fold, no synthetic append), repeating until the array ends on
#     `role: "user"` (or is empty). Covers both real "assistant message
#     prefill" (trailing role:"assistant") and a trailing inline
#     role:"system" message (Claude Code emits an agent-definitions block
#     this way, alongside the normal top-level `system` field). Some
#     Anthropic-compatible upstreams reject either case with 400 "This
#     model does not support assistant message prefill. The conversation
#     must end with a user message." Logs one LOG_LEVEL=trace line per
#     stripped message showing exactly what was removed.
# [transforms.claude_anthropic_compat]
# schema = "anthropic-messages"
# before_upstream.builtins = ["ensure_trailing_user_message"]

# DEFAULT TRANSFORM — applied automatically to every openai-completions and
# openai-responses route. Renames max_tokens → max_completion_tokens, which is
# required by most modern OpenAI-compatible upstreams (DeepSeek, MiniMax, etc.).
# To opt a specific model entry OUT, attach the no_max_completion_tokens set to
# that entry's `transforms` field (e.g. for api.qnaigc.com which keeps the old name).
[transforms.max_tokens_rename]
schema = "openai-completions"
before_upstream.ops = [
  {op = "rename", path = "max_tokens", to = "max_completion_tokens"},
]

# Opt-out set — restores the original max_tokens name for upstreams that reject
# max_completion_tokens. Attach via `transforms = "no_max_completion_tokens"` on
# any model entry that needs it.
# [transforms.no_max_completion_tokens]
# schema = "openai-completions"
# before_upstream.ops = [
#   {op = "rename", path = "max_completion_tokens", to = "max_tokens"},
# ]

# DEFAULT — wire max_tokens_rename to every openai-completions and openai-responses
# route automatically. Resolution order: mode-defaults → per-entry transforms, so a
# per-entry no_max_completion_tokens set overrides this default for that model.
[transform_defaults]
openai-completions = ["max_tokens_rename"]
openai-responses   = ["max_tokens_rename"]

# Attach multiple transforms to a model entry (applied left-to-right):
# In [models.FREE]:
#   deepseek-v4-comp = {target = "deepseek-v4-flash", base_url = "...", api_key = "...", transforms = "deepseek_compat"}
#   deepseek-v4-anth = {target = "deepseek-v4-flash", base_url = "...", api_key = "...", mode = "anthropic-messages", transforms = "deepseek_v4_anthropic_compat"}
#   max-m3-comp      = {target = "MiniMax-M3", base_url = "...", api_key = "...", transforms = "minimax_compat"}
#   qnaigc-gpt       = {target = "gpt-x", base_url = "https://api.qnaigc.com", api_key = "...", transforms = "no_max_completion_tokens"}

# Privacy filter — redacts PII and hash-shaped secrets (API keys / tokens) from
# outgoing LLM request text and restores them on the response. Two modes:
#
#   * `sidecar` (default when a URL is configured): the heavy PII model runs in
#     the Python sidecar at `submodules/privacy-filter/serve.py`, reached over
#     HTTP. The sidecar also runs the entropy-based hash/API-key scan
#     (`hash_detect.py`) and emits `⟦HASH:n⟧` sentinels alongside `⟦PII:n⟧`.
#   * `local`: an in-process TypeScript port of `hash_detect.py`
#     (`src/utils/hash-detect.ts`) runs on every text fragment. No HTTP call,
#     no Python sidecar — only hex-shaped secrets are caught (no PII model).
#
# The plugin is fully inert unless one of these is true:
#   * `PRIVACY_FILTER_URL` env var is set (forces sidecar mode), or
#   * toml `filter_mode = "local"` (no URL required), or
#   * toml `filter_mode = "sidecar"` AND a valid `filter_url`.
#
# Env vars override toml values. There is no separate `enabled` flag — the
# combination of `filter_mode` and `filter_url` is what turns the plugin on.
#
# [privacy_filter]
# "sidecar" (default when a filter_url is configured) | "local"
# filter_mode = "local"       
# filter_url = "http://localhost:9500"   # required for sidecar, ignored in local mode
# timeout_ms = 40000          # sidecar only: per-call timeout
# max_chars = 1024000         # skip redaction above this total text size
# entropy_threshold = 3.0     # local mode only: Shannon entropy cutoff for hash detection
# hash_min_len = 8            # local mode only: minimum hex token length to classify as a hash (default 8)
# whitelist_add = []          # additional hex tokens to skip (lowercased)
# whitelist_remove = []       # tokens to remove from the built-in whitelist
# Node-only: one hex token per line, `#` starts a comment
# whitelist_file = ""

# -----------------------------------------------------------------------------
# Image-encode sidecar (optional).
#
# When set, OpenAI image_url -> Gemini inline_data conversion delegates the
# http(s) fetch + base64 encode to this sidecar instead of doing it in-process.
# The sidecar receives POST {image_encode}/encode with body {"url": "..."} and
# returns {"mime_type": "...", "data": "<base64>"}.
#
# The sidecar must be reachable on localhost or a private/LAN host (validated
# via isInternalHost). The image URL's own SSRF policy is the sidecar's
# responsibility — the proxy skips its in-process isInternalHost check on the
# image URL when a sidecar is configured.
#
# When unset, the proxy does the fetch + base64 in-process with its own SSRF
# guard (loopback / RFC1918 / link-local / mDNS blocked) and a 20 MiB byte cap.
#
# Env vars (override toml): IMAGE_ENCODE_URL, IMAGE_ENCODE_TIMEOUT_MS.
#
# [fetch]
# image_encode = "localhost:34567"   # shorthand; "http://localhost:34567" also accepted
# timeout_ms = 40000                 # per-call timeout

